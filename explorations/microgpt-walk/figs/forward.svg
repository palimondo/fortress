<text x="80" y="301" class="t-body">x4 through lm, then sm</text>
<text x="234" y="301" class="muted">16 by 27</text>
<text x="298" y="301">lm</text>
<line class="ink" x1="52" y1="282" x2="52" y2="288"/>
<rect class="soft" x="30" y="312" width="44" height="18" rx="3"/>
<text x="52" y="325" text-anchor="middle">loss</text>
<text x="80" y="325" class="t-body">from pr, tg, vm, nv</text>
<text x="234" y="325" class="muted">1 number</text>
<line class="ink" x1="52" y1="306" x2="52" y2="312"/>
