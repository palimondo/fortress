<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>microGPT in Fortress, at the level of matrices</title>
<style>
:root { color-scheme: light dark;
  --bg: #fbfaf7; --fg: #1d1d1b; --muted: #5b5b57; --rule: #d9d6cf; --card: #ffffff; --accent: #8a3b12; --code-bg: #f1efe9; --py-bg: #eef2f7; --mark: #fff3cd; }
@media (prefers-color-scheme: dark) { :root { --bg: #14161a; --fg: #e6e4de; --muted: #a5a39c; --rule: #33373d; --card: #1b1e23; --accent: #e5a37a; --code-bg: #1f2329; --py-bg: #1c2430; --mark: #3d3418; } }
html { background: var(--bg); color: var(--fg); }
body { margin: 0; font: 17px/1.55 Georgia, "Times New Roman", serif; }
main { max-width: 64rem; margin: 0 auto; padding: 2rem 1.2rem 5rem; }
h1 { font-size: 2.1rem; line-height: 1.15; margin: 0.5rem 0 0.2rem; }
h2 { font-size: 1.5rem; margin: 2.6rem 0 0.6rem; border-bottom: 1px solid var(--rule); padding-bottom: 0.25rem; }
h3 { font-size: 1.15rem; margin: 1.8rem 0 0.4rem; }
p, li { max-width: 48rem; }
a { color: var(--accent); }
code { font: 0.9em/1.4 ui-monospace, Menlo, Consolas, monospace; background: var(--code-bg); padding: 0.05em 0.3em; border-radius: 3px; }
pre { font: 0.85rem/1.45 ui-monospace, Menlo, Consolas, monospace; background: var(--code-bg); padding: 0.8rem 1rem; border-radius: 6px; overflow-x: auto; margin: 0.6rem 0; }
pre code { background: none; padding: 0; font-size: inherit; }
pre.py { background: var(--py-bg); }
pre.py::before, pre.fss::before, pre.out::before { display: block; font: 0.7rem ui-monospace, monospace; color: var(--muted); margin-bottom: 0.4rem; letter-spacing: 0.05em; text-transform: uppercase; }
pre.py::before { content: "python, pinned microgpt.py (sha256 d47d88c2…)"; }
pre.fss::before { content: "fortress source"; }
pre.out::before { content: "interpreter output"; }
figure.fig { margin: 0.9rem 0 1.2rem; background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 0.8rem 1rem 0.5rem; }
figure.fig .scroll { overflow-x: auto; }
figure.fig svg.code { display: block; fill: currentColor; max-width: none; }
figure.fig details { margin-top: 0.5rem; }
figure.fig summary { font: 0.8rem/1.4 system-ui, sans-serif; color: var(--muted); cursor: pointer; }
figure.fig details pre { margin: 0.4rem 0 0; }
.math { margin: 0.7rem 0 0.9rem; overflow-x: auto; }
.math svg.formula { fill: currentColor; display: block; }
.pair { display: grid; grid-template-columns: 1fr; gap: 0.6rem; margin: 1rem 0 1.4rem; }
@media (min-width: 62rem) { .pair { grid-template-columns: 1fr 1fr; } .pair > .wide { grid-column: 1 / -1; } }
.pair > div { min-width: 0; }
.pair h4 { margin: 0 0 0.3rem; font: 600 0.75rem/1.3 system-ui, sans-serif; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.pair pre { margin: 0; }
.pair figure.fig { margin: 0; }
table { border-collapse: collapse; font-size: 0.9rem; margin: 0.8rem 0; }
th, td { border: 1px solid var(--rule); padding: 0.35rem 0.6rem; text-align: left; vertical-align: top; }
th { background: var(--code-bg); }
.tablewrap, .md-table { overflow-x: auto; }
main > table { display: block; overflow-x: auto; }
.note { border-left: 3px solid var(--accent); padding: 0.2rem 0.9rem; margin: 1rem 0; background: var(--card); }
.small { font-size: 0.9rem; color: var(--muted); }
hr { border: 0; border-top: 1px solid var(--rule); margin: 2rem 0; }
mark { background: var(--mark); color: inherit; }
</style>
</head>
